name: Exact-source regression validation
on:
  push:
    branches: ['validation/casper-metric-input-alignment-20260928']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PROJ_NETWORK: 'OFF'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/language
          ref: 'e2f02c1a305d102668c73fb7c08b32904bc3c63b'
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install tensorflow==2.15.1 numpy==1.26.4 absl-py pytest pytest-cov ruff
      - name: Verify exact source and original-code controls
        run: python validation/verify.py work evidence
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ matrix.python }}
          path: evidence
          retention-days: 14
